# Name your project! Project names should be lowercase and use underscores as separators
# See documentation: https://docs.getdbt.com/docs/building-a-dbt-project/projects

name: 'payments_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'payments_analytics'

# These configurations specify where dbt should look for different types of files.
# The `source-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  payments_analytics:
    # Staging models - views
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
      +description: "Staging models that normalize raw Airbyte data"
    
    # Intermediate models - ephemeral (not materialized, used inline)
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +tags: ["intermediate"]
      +description: "Intermediate models with business logic transformations"
    
    # Mart models - fact and dimension tables
    marts:
      +schema: marts
      +tags: ["marts"]
      
      # Fact tables - incremental
      facts:
        +materialized: incremental
        +tags: ["facts"]
        +description: "Fact tables with transactional grain"
      
      # Dimension tables - full refresh
      dimensions:
        +materialized: table
        +tags: ["dimensions"]
        +description: "Dimension tables with full refresh"
    
    # Analytics views - views
    views:
      +materialized: view
      +schema: analytics
      +tags: ["views", "kpi"]
      +description: "Analytics views and KPI definitions"

# Seed configurations
seeds:
  payments_analytics:
    +schema: seeds
    +tags: ["seeds"]

# Test configurations
tests:
  payments_analytics:
    +store_failures: true
    +severity: error

# Variable configurations
vars:
  start_date: '2024-01-01'
  end_date: '2030-12-31'
  lookback_days: 30
  high_risk_threshold: 0.7
  kyc_verification_threshold: 0.8

# Require dbt version >= 1.0.0
require-dbt-version: [">=1.0.0"]